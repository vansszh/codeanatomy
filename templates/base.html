<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CodeAnatomy{% endblock %}</title>
    <meta name="description" content="{% block description %}Understand the time and space complexity of your Python code.{% endblock %}">
    <meta name="theme-color" content="#050505">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    {% block styles %}{% endblock %}

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23050505'/%3E%3Cpath d='M11 9 6 16l5 7M21 9l5 7-5 7M18 8l-4 16' stroke='%23b7f36b' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body{% block bodyattrs %}{% endblock %}>

{% block overlay %}{% endblock %}

<header class="chrome">
    <div class="chrome-in">
        <a class="brand" href="/" data-hover>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M8.5 5.5 3 12l5.5 6.5" stroke="var(--violet-1)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M15.5 5.5 21 12l-5.5 6.5" stroke="var(--cyan-1)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M13.4 4 10.6 20" stroke="var(--mint-1)" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <span>CodeAnatomy</span>
        </a>

        <nav class="nav" aria-label="Primary">
            <a href="/analysis" class="{{ 'on' if active == 'analysis' }}" {% if active == 'analysis' %}aria-current="page"{% endif %}>Complexity<i></i></a>
        </nav>

        <div class="chrome-cta">
            <a class="btn ghost" href="/analysis" data-goto="/analysis" data-hover data-magnet="4">
                <span>Open workspace</span>
                <span class="btn-arrow" aria-hidden="true">
                    <svg viewBox="0 0 15 15" fill="none">
                        <path d="M2 7.5h11M8.6 3.1 13 7.5l-4.4 4.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
            </a>
        </div>
    </div>
</header>

<div class="shell">
    {% block content %}{% endblock %}
</div>

<footer class="foot">
    <div class="wrap foot-in">
        <p class="foot-note">CodeAnatomy</p>
        <div class="foot-links">
            <a href="/analysis" data-goto="/analysis" data-hover><span>Complexity</span></a>
        </div>
        <p class="foot-note">Complexity analysis</p>
    </div>
</footer>

{% block scripts %}{% endblock %}
</body>
</html>
